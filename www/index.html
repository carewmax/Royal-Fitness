<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Royal Fitness</title>
<meta name="description" content="Royal Fitness, Freetown: memberships, gym schedule, Royal Nutrition and the Royal Fitness member app.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: dark gym-floor surfaces, photographic bands, yellow reserved for actions, progress and the selected state. Single dark look by design. */
:root{
  --ink:#0a0a09; --coal:#121210; --panel:#191815; --panel2:#211f1b; --line:#312e27; --line2:#45412f;
  --fg:#f5f3ec; --mute:#aaa597; --dim:#757062;
  --yel:#ffd60a; --yel-soft:rgba(255,214,10,.12); --gold:#c9a03a; --gold2:#e8c56a; --on-yel:#0a0a09;
  --ok:#4ade80; --warn:#fb923c; --bad:#f87171; --info:#7dd3fc;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px; --maxw:1180px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--fg);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--yel)}
h1,h2,h3,h4{font-family:var(--display);text-transform:uppercase;letter-spacing:.01em;line-height:1;margin:0;text-wrap:balance;font-weight:800}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--yel);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:20px}
.eyebrow{font:700 .78rem/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--yel)}
.mute{color:var(--mute)} .dim{color:var(--dim)} .small{font-size:.86rem} .tiny{font-size:.76rem}
.y{color:var(--yel)} .gold{color:var(--gold2)}
.stack{display:flex;flex-direction:column;gap:12px} .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.minw0{min-width:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:0;background:var(--yel);color:var(--on-yel);font:700 .86rem/1 var(--body);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:#ffe23d}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line2)}
.btn.ghost:hover{border-color:var(--yel);color:var(--yel)}
.btn.dark{background:var(--panel2);color:var(--fg)}
.btn.sm{min-height:36px;padding:0 14px;font-size:.76rem}
.btn.block{width:100%}
.btn.danger{background:transparent;border:1px solid #5b2a2a;color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--yel);cursor:pointer;padding:0;font-weight:600;text-decoration:none}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* surfaces */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.flat{background:var(--coal)}
.card h3{font-size:1.25rem}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:700 .7rem/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line2);color:var(--mute)}
.pill.ok{color:var(--ok);border-color:rgba(74,222,128,.35)}
.pill.warn{color:var(--warn);border-color:rgba(251,146,60,.4)}
.pill.bad{color:var(--bad);border-color:rgba(248,113,113,.4)}
.pill.y{color:var(--yel);border-color:rgba(255,214,10,.4)}
.demo-tag{display:inline-flex;gap:6px;align-items:center;padding:3px 8px;border-radius:4px;background:repeating-linear-gradient(-45deg,#2a2510 0 6px,#221f0e 6px 12px);color:var(--yel);font:700 .68rem/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;border:1px dashed rgba(255,214,10,.45)}
.notice{border:1px dashed var(--line2);border-radius:var(--r);padding:12px 14px;color:var(--mute);font-size:.88rem;background:var(--coal)}
.notice strong{color:var(--fg)}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--coal);color:var(--mute);cursor:pointer;font-weight:600;font-size:.86rem}
.chip.on{background:var(--yel);color:var(--on-yel);border-color:var(--yel)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs .chip{flex:none}

/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-size:.82rem;color:var(--mute);font-weight:600}
.in,select.in,textarea.in{min-height:44px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--coal);color:var(--fg);width:100%}
.in:focus{border-color:var(--yel);outline:none}
.err{color:var(--bad);font-size:.84rem}
fieldset{border:0;padding:0;margin:0} legend{font-size:.82rem;color:var(--mute);font-weight:600;margin-bottom:8px}

/* public header */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(10,10,9,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:18px;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.brand img{width:44px;height:44px;border-radius:50%}
.brand b{font:800 1.15rem/0.95 var(--display);letter-spacing:.04em;color:var(--gold2)}
.nav{display:flex;gap:4px;margin-left:auto;align-items:center}
.nav a{color:var(--mute);text-decoration:none;font-weight:600;font-size:.9rem;padding:8px 10px;border-radius:6px}
.nav a:hover{color:var(--fg)} .nav a.on{color:var(--yel)}
.menu-btn{display:none;margin-left:auto;background:none;border:1px solid var(--line);border-radius:8px;width:44px;height:44px;color:var(--fg);cursor:pointer}
@media (max-width:980px){
  .menu-btn{display:inline-flex;align-items:center;justify-content:center}
  .nav{display:none;position:absolute;left:0;right:0;top:68px;flex-direction:column;align-items:stretch;background:var(--coal);border-bottom:1px solid var(--line);padding:10px 16px 16px}
  .nav.open{display:flex}
  .nav a{padding:12px 6px}
}

.hero .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--ink) 0%,rgba(10,10,9,.92) 38%,rgba(10,10,9,.35) 75%,rgba(10,10,9,.55) 100%),linear-gradient(0deg,var(--ink),transparent 40%)}
.hero .wrap{position:relative;padding-block:72px 64px;display:flex;flex-direction:column;gap:22px;max-width:var(--maxw)}
.hero h1{font-size:clamp(3rem,8.5vw,6.4rem);line-height:.88}
.hero h1 em{display:block;font-style:italic;color:var(--yel)}
.hero .lead{max-width:34rem;font-size:1.12rem;color:#dcd8cc}
.hero-logo{width:96px;height:96px;border-radius:50%;box-shadow:0 0 0 1px var(--line2),0 10px 40px rgba(201,160,58,.25)}
section.band{padding-block:64px}
.sec-head{display:flex;flex-direction:column;gap:10px;margin-bottom:28px;max-width:44rem}
.sec-head h2{font-size:clamp(2rem,5vw,3.2rem)}
.feat{display:flex;flex-direction:column;gap:10px;padding:20px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.feat .ic{width:44px;height:44px;border:1.5px solid var(--yel);border-radius:10px;display:grid;place-items:center;color:var(--yel)}
.feat h3{font-size:1.15rem}
.photo-band{position:relative;overflow:hidden;border-block:1px solid var(--line)}
.photo-band .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.photo-band .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,10,9,.95),rgba(10,10,9,.6) 60%,rgba(10,10,9,.3))}
.photo-band .wrap{position:relative;padding-block:72px}
.tg{display:inline-block;background:var(--yel);color:var(--on-yel);font:800 1rem/1 var(--display);letter-spacing:.06em;padding:6px 10px;border-radius:4px;transform:skew(-8deg)}

/* plans */
.plans{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.plan{position:relative;display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);cursor:pointer;text-align:left}
.plan:hover{border-color:var(--line2)}
.plan.sel{border-color:var(--yel);box-shadow:0 0 0 1px var(--yel) inset}
.plan .nm{font:700 .82rem/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.plan .pr{font:800 2.6rem/1 var(--display)}
.plan .un{font-size:.86rem;color:var(--mute)}
.plan .badge{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--yel);color:var(--on-yel);font:800 .66rem/1 var(--body);letter-spacing:.1em;padding:5px 9px;border-radius:4px;white-space:nowrap}
.plan ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.86rem;color:#d8d4c8}
.plan li::before{content:"✓ ";color:var(--yel);font-weight:700}

/* schedule */
.sched{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.day{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.day h3{font-size:1.4rem;padding:14px 16px;border-bottom:3px solid var(--c,var(--yel));background:linear-gradient(180deg,var(--panel2),var(--panel))}
.cls{display:flex;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.cls:first-of-type{border-top:0}
.cls time{flex:none;min-width:76px;text-align:center;font:700 .8rem/1 var(--body);padding:6px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--mute)}
.cls b{font-family:var(--display);font-size:1.1rem;letter-spacing:.02em;text-transform:uppercase}

/* menu */
.menu-list{display:flex;flex-direction:column}
.mi{display:flex;gap:12px;align-items:baseline;padding:12px 0;border-bottom:1px dashed var(--line)}
.mi .nm{font:700 1.15rem/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.mi .lead{flex:1;border-bottom:1px dotted var(--line2);transform:translateY(-4px)}
.mi .pr{font:700 1rem/1 var(--display);color:var(--yel);white-space:nowrap}

/* phone mock */

/* member shell */
.mbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(10,10,9,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.mbar .wrap{display:flex;align-items:center;gap:14px;min-height:64px}
.mnav{display:flex;gap:2px;margin-left:auto}
.mnav a{display:flex;align-items:center;gap:6px;color:var(--mute);text-decoration:none;font-weight:600;font-size:.88rem;padding:8px 10px;border-radius:6px}
.mnav a.on{color:var(--yel)}
.iconbtn{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--coal);color:var(--fg);display:inline-grid;place-items:center;cursor:pointer;text-decoration:none}
.iconbtn .dot{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--yel);color:var(--on-yel);font:800 .66rem/18px var(--body);text-align:center;padding:0 4px}
.bnav{display:none}
main.member{padding-block:22px 40px}
@media (max-width:860px){
  .mnav{display:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(14,14,12,.97);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);text-decoration:none;font-size:.7rem;font-weight:600;padding:6px 0;min-height:48px}
  .bnav a.on{color:var(--yel)}
  main.member{padding-bottom:110px}
}
.examplebar{background:repeating-linear-gradient(-45deg,#1d1a0b 0 10px,#191709 10px 20px);border-bottom:1px solid #3b3415}
.examplebar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-height:44px;font-size:.84rem;color:#e9dfae;padding-block:6px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-h h1{font-size:clamp(2rem,6vw,2.8rem)}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .k{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:.8rem;font-weight:600}
.tile .k .ico{width:18px;height:18px;color:var(--yel)}
.tile .v{font:700 1.9rem/1 var(--display)}
.tile .v small{font:500 .85rem var(--body);color:var(--mute);margin-left:4px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.li{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0}
.li .t b{display:block;overflow:hidden;text-overflow:ellipsis}
.thumb{width:52px;height:52px;border-radius:8px;flex:none;background:var(--panel2) center/cover;display:grid;place-items:center;color:var(--yel)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:34px 20px;border:1px dashed var(--line2);border-radius:var(--r);background:var(--coal)}
.empty .ico{width:34px;height:34px;color:var(--yel)}
.empty h3{font-size:1.3rem}
.bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--yel);border-radius:4px}
.gauge text{font-family:var(--display)}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:300px;height:auto}

/* member card */
.mcard{position:relative;overflow:hidden;border-radius:16px;padding:22px;background:radial-gradient(120% 140% at 100% 0%,#3a2e10 0%,#17150f 45%,#0d0d0b 100%);border:1px solid #5a4a1c;box-shadow:0 20px 50px rgba(0,0,0,.5);display:grid;grid-template-columns:1fr auto;gap:16px;max-width:560px}
.mcard::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(232,197,106,.08) 50%,transparent 60%);pointer-events:none}
.mcard .qr{background:#fff;border-radius:10px;padding:8px;width:116px;height:116px;align-self:start}
.mcard .qr svg{width:100%;height:100%;display:block}
.mcard .id{font:600 .9rem/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;color:var(--gold2)}

.scanbox video,.scanbox canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanbox .frame{position:absolute;inset:18%;border-radius:12px}
.scanbox .frame::before,.scanbox .frame::after{content:"";position:absolute;inset:0;border:4px solid var(--yel);border-radius:14px;clip-path:polygon(0 0,28% 0,28% 6px,6px 6px,6px 28%,0 28%,0 72%,6px 72%,6px calc(100% - 6px),28% calc(100% - 6px),28% 100%,72% 100%,72% calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) 72%,100% 72%,100% 28%,calc(100% - 6px) 28%,calc(100% - 6px) 6px,72% 6px,72% 0,100% 0,100% 0)}
.scanbox .shade{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.scanline{position:absolute;left:20%;right:20%;height:2px;background:var(--yel);box-shadow:0 0 12px var(--yel);top:20%;animation:scan 2.4s ease-in-out infinite alternate}
@keyframes scan{to{top:78%}}

/* session */
.setrow{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:8px;align-items:center}
.setrow .in{min-height:40px;text-align:center}
.timer{font:800 3rem/1 var(--display);color:var(--yel)}
.sticky-actions{position:sticky;bottom:0;z-index:5;background:linear-gradient(0deg,var(--ink) 70%,transparent);padding-block:14px 8px}
@media (max-width:860px){.sticky-actions{bottom:calc(64px + env(safe-area-inset-bottom,0px))}}

/* diary */
.tl{position:relative;display:flex;flex-direction:column;gap:10px;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.ev{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.ev::before{content:"";position:absolute;left:-20px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--ink);border:2px solid var(--c,var(--yel))}
.ev .t{flex:1;min-width:0}
.ev time{font:700 .82rem/1 var(--body);color:var(--mute);min-width:44px}
.macros{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--mute)}
.macros b{color:var(--fg);font-weight:600}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;max-height:460px;overflow-y:auto;padding:4px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;font-size:.94rem;white-space:pre-line}
.msg.me{align-self:flex-end;background:var(--yel);color:var(--on-yel);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal .sheet{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--coal);border:1px solid var(--line2);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.modal{align-items:center}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--fg);color:var(--ink);padding:10px 18px;border-radius:999px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
.steps-flow{counter-reset:s;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.steps-flow li{list-style:none;counter-increment:s;padding:14px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:.9rem}
.steps-flow li::before{content:counter(s);display:block;font:800 1.6rem/1 var(--display);color:var(--yel);margin-bottom:6px}
.steps-flow{padding:0;margin:0}
footer.site{border-top:1px solid var(--line);padding-block:36px 100px;color:var(--mute);font-size:.9rem}
.checkout{max-width:760px;margin:0 auto;padding-block:30px 60px}
.progress-steps{display:flex;gap:6px;margin-bottom:22px}
.progress-steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress-steps i.on{background:var(--yel)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.92rem}
.kv dt{color:var(--mute)} .kv dd{margin:0;font-weight:600;text-align:right}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

const parseISO = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parseISO(s); d.setDate(d.getDate()+n); return iso(d.getTime()); };
const diffDays = (a,b) => { const p=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)}; return Math.round((p(b)-p(a))/DAY); };

/* ---------- storage (browser-only demo store) ---------- */
const KEY = 'royal-fitness-demo-v1';
const fresh = () => ({orders:[], tokens:[], accounts:[], session:null, clockOffset:0});
let S = (() => { try { const v = localStorage.getItem(KEY); if (v) return JSON.parse(v); } catch(e){} return fresh(); })();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
const nowMs = () => Date.now() + (S.clockOffset||0)*DAY;   // "backend clock" (demo can shift it)
const today = () => iso(nowMs());
const acc = () => S.accounts.find(a => a.id === S.session);
const hashPw = pw => { let h=5381; for (const c of pw) h=((h<<5)+h+c.charCodeAt(0))|0; return 'demo$'+(h>>>0).toString(36); }; // production: argon2/bcrypt on the server

/* =====================================================================
   DEMO BACKEND — stands in for the server. Production rules it models:
   * payment status changes only through a verified provider event
   * activation tokens are random, single-use and expire
   * membership status is computed from dates on the server clock
   ===================================================================== */
const Backend = {
  createOrder({planId, name, phone, email, purpose='new', accountId=null}) {
    const plan = planById(planId);
    const key = [purpose, accountId || phone.replace(/\D/g,''), planId].join('|');
    // idempotency: a refresh or second tap returns the open order instead of creating a duplicate
    const open = S.orders.find(o => o.key === key && ['pending','awaiting'].includes(o.status));
    if (open) return open;
    const o = {id:'ORD-'+rnd(8), key, planId, amount:plan.price, name, phone, email, purpose, accountId, status:'pending', created:nowMs(), provider:'Monime (integration point)'};
    S.orders.push(o); save(); return o;
  },
  /* In production this is the provider webhook handler: verify the signature, re-fetch the payment from the provider API, then update the order. */
  providerEvent(orderId, outcome) {
    const o = S.orders.find(x => x.id === orderId);
    if (!o || o.status === 'paid') return o;
    o.status = outcome;  // paid | failed | cancelled | awaiting
    if (outcome === 'paid') {
      o.paidAt = nowMs(); o.receipt = 'RCPT-'+rnd(8);
      if (o.purpose === 'new') this.issueToken(o);
      else this.applyRenewal(o);
    }
    save(); return o;
  },
  issueToken(o) {
    S.tokens.forEach(t => { if (t.orderId === o.id) t.revoked = true; });
    const t = {token: rnd(4)+'-'+rnd(4)+'-'+rnd(4)+'-'+rnd(4), orderId:o.id, expires: nowMs() + CONFIG.activationHours*3600e3, used:false};
    S.tokens.push(t); save(); return t;
  },
  checkToken(token) {
    const t = S.tokens.find(x => x.token === (token||'').trim().toUpperCase());
    if (!t) return {state:'invalid'};
    if (t.used) return {state:'used', t};
    if (t.revoked) return {state:'revoked', t};
    const o = S.orders.find(x => x.id === t.orderId);
    if (!o || o.status !== 'paid') return {state:'unpaid', t};
    if (nowMs() > t.expires) return {state:'expired', t, o};
    return {state:'ok', t, o};
  },
  /* Resume an interrupted activation: re-issue a fresh token for a paid, unclaimed order, matched on order number + phone. */
  resendToken(orderId, phone) {
    const o = S.orders.find(x => x.id === orderId.trim().toUpperCase());
    if (!o || o.status !== 'paid' || o.purpose !== 'new') return {error:'We could not find a paid, unclaimed order with those details.'};
    if (o.phone.replace(/\D/g,'') !== phone.replace(/\D/g,'')) return {error:'That phone number does not match the order.'};
    if (S.tokens.some(t => t.orderId === o.id && t.used)) return {error:'This membership has already been activated. Log in instead.'};
    return {t:this.issueToken(o)};
  },
  redeem(token, {name, password}) {
    const r = this.checkToken(token); if (r.state !== 'ok') return {error:r.state};
    const o = r.o, plan = planById(o.planId);
    const existing = S.accounts.find(a => a.phone.replace(/\D/g,'') === o.phone.replace(/\D/g,''));
    if (existing) return {error:'exists'};
    const start = today();
    const a = newAccount({name, phone:o.phone, email:o.email, password});
    a.memberships.push({id:'MEM-'+rnd(6), planId:plan.id, start, end:addDays(start, plan.days-1), orderId:o.id, receipt:o.receipt});
    a.transactions.push({date:start, orderId:o.id, receipt:o.receipt, plan:plan.name, amount:plan.price, kind:'New membership'});
    notify(a, 'pay:'+o.id, 'Payment confirmed', `Receipt ${o.receipt} · ${plan.name} membership.`);
    notify(a, 'act:'+a.id, 'Account activated', 'Welcome to Royal Fitness. Your member identity is ready.');
    r.t.used = true; S.accounts.push(a); S.session = a.id; save();
    return {a};
  },
  applyRenewal(o) {
    const a = S.accounts.find(x => x.id === o.accountId); if (!a) return;
    const plan = planById(o.planId), cur = currentMembership(a), t = today();
    const start = (CONFIG.renewalRule === 'stack' && cur && cur.end >= t) ? addDays(cur.end, 1) : t;
    a.memberships.push({id:'MEM-'+rnd(6), planId:plan.id, start, end:addDays(start, plan.days-1), orderId:o.id, receipt:o.receipt, renewal:true});
    a.transactions.push({date:t, orderId:o.id, receipt:o.receipt, plan:plan.name, amount:plan.price, kind:'Renewal'});
    notify(a, 'ren:'+o.id, 'Membership renewed', `${plan.name} added. Your membership now runs until ${fmt(addDays(start, plan.days-1))}.`);
  },
  login(phone, password) {
    const a = S.accounts.find(x => x.phone.replace(/\D/g,'') === phone.replace(/\D/g,''));
    if (!a || a.pass !== hashPw(password)) return {error:'Phone number or password is incorrect.'};
    S.session = a.id; save(); return {a};
  },
};

function newAccount({name, phone, email, password}) {
  return {id:uid(), memberId:'RF-'+rnd(6,'0123456789'), qrRef:'RFM1.'+rnd(20), name, phone, email:email||'', pass:hashPw(password),
    verified:false, onboarded:false, created:today(), example:false,
    profile:{units:'metric', days:['Mon','Wed','Fri'], duration:45, where:'royal', goals:['general'], diet:[], restrict:'', experience:'beginner', activity:'light'},
    memberships:[], transactions:[], workouts:[], diary:[], weights:[], notifications:[], notifSent:{}, scans:[], formVideos:[], prefs:{workout:true, diary:true, membership:true, tracking:false}};
}

/* ---------- membership status (computed, never stored on the client) ---------- */
function currentMembership(a) {
  const t = today(), ms = [...a.memberships].sort((x,y)=>x.start.localeCompare(y.start));
  return ms.find(m => m.start <= t && m.end >= t) || ms.filter(m=>m.start<=t).pop() || ms[0] || null;
}
function membershipEnd(a) { return a.memberships.reduce((e,m)=> m.end > e ? m.end : e, ''); }
function memberStatus(a) {
  if (!a || !a.memberships.length) return {key:'none', label:'No membership', cls:'bad'};
  const end = membershipEnd(a), left = diffDays(today(), end);
  const pending = S.orders.some(o => o.accountId === a.id && o.purpose==='renew' && ['pending','awaiting'].includes(o.status));
  if (left < 0) return {key:'expired', label:'Expired', cls:'bad', end, left, pending};
  if (pending) return {key:'renewal-pending', label:'Renewal pending', cls:'warn', end, left, pending};
  if (left <= CONFIG.expiringSoonDays) return {key:'expiring', label:'Expiring soon', cls:'warn', end, left};
  return {key:'active', label:'Active', cls:'ok', end, left};
}
function notify(a, key, title, body, action) {
  if (a.notifSent[key]) return;   // never send the same event twice
  a.notifSent[key] = nowMs();
  a.notifications.unshift({id:uid(), key, title, body, action, at:nowMs(), read:false});
}
function syncMembershipNotices(a) {
  const st = memberStatus(a); if (st.key === 'none') return;
  if (st.left < 0) { notify(a, `exp:${st.end}:expired`, 'Your membership has expired', `It ended on ${fmt(st.end)}. Your records are kept. Renew to continue tracking.`, 'renew'); return; }
  const due = CONFIG.notifyDaysBefore.filter(d => st.left <= d).sort((x,y)=>x-y);
  if (!due.length || !a.prefs.membership) return;

  delete a.notifSent[k];

    `Your current membership expires in ${st.left} day${st.left===1?'':'s'} (${fmt(st.end)}). Renew now to continue enjoying your Royal Fitness member benefits and fitness tracking.`, 'renew');
}

/* ---------- energy, workouts, score ---------- */
function bmr(p) {
  if (!p.weight || !p.height || !p.age) return null;
  const base = 10*p.weight + 6.25*p.height - 5*p.age;   // Mifflin–St Jeor
  return p.sex === 'male' ? base + 5 : p.sex === 'female' ? base - 161 : base - 78;
}
function workoutKcal(w, kg) {
  const met = w.type === 'cardio' ? 7 : w.type === 'hiit' ? 8 : w.type === 'other' ? 4 : 5;
  return Math.round(met * (kg||70) * (w.mins||0) / 60);
}
const workoutsOn = (a, d) => a.workouts.filter(w => w.date === d);
const volume = w => (w.exercises||[]).reduce((s,e)=> s + e.sets.reduce((t,x)=> t + (+x.kg||0)*(+x.reps||0), 0), 0);
function dayTotals(a, d) {
  const food = a.diary.filter(e => e.date===d && e.kind==='food');
  const act = a.diary.filter(e => e.date===d && e.kind==='activity');
  const water = a.diary.filter(e => e.date===d && e.kind==='water').reduce((s,e)=>s+(+e.ml||0),0);
  const wk = workoutsOn(a,d).filter(w=>!w.dismissed);
  const sum = k => food.reduce((s,e)=>s+(+e[k]||0)*(+e.qty||1),0);
  const steps = act.reduce((s,e)=>s+(+e.steps||0),0);
  const km = act.reduce((s,e)=>s+(+e.km||0),0) + wk.reduce((s,w)=>s+(+w.km||0),0);
  const activeMin = act.reduce((s,e)=>s+(+e.mins||0),0) + wk.reduce((s,w)=>s+(+w.mins||0),0);
  const b = bmr(a.profile);
  const baseline = b ? Math.round(b*1.2) : null;                  // resting + daily living, excluding logged exercise
  const exKcal = wk.reduce((s,w)=>s+(w.kcal||0),0);
  const stepKcal = Math.round(steps * 0.04);                      // ~0.04 kcal/step; walking workouts logged separately
  const activity = exKcal + stepKcal;
  const total = baseline!=null ? baseline + activity : null;
  const consumed = Math.round(sum('kcal'));
  return {food, act, wk, water, steps, km, activeMin, consumed, p:Math.round(sum('p')), c:Math.round(sum('c')), f:Math.round(sum('f')),
          baseline, exKcal, stepKcal, activity, total, balance: (total!=null && food.length) ? consumed - total : null};
}
const firstRecordDate = a => [...a.workouts.map(w=>w.date), ...a.diary.map(e=>e.date), ...a.weights.map(w=>w.date)].sort()[0];
function bestByExercise(ws) {
  const m = {};
  ws.forEach(w => (w.exercises||[]).forEach(e => e.sets.forEach(s => { if (!+s.kg) return; const e1 = (+s.kg)*(1+(+s.reps||0)/30); if (!m[e.exId] || e1 > m[e.exId]) m[e.exId] = e1; })));
  return m;
}
function computeScore(a, ref = today()) {
  const W = CONFIG.score.weights, N = CONFIG.score.windowDays, first = firstRecordDate(a);
  if (!first || diffDays(first, ref) < CONFIG.score.minDaysOfData) return null;
  const from = addDays(ref, -N+1), inWin = d => d >= from && d <= ref;
  const ws = a.workouts.filter(w => inWin(w.date) && !w.dismissed);
  const planned = Math.max(1, a.profile.days.length || 3);
  const comp = {};
  comp.consistency = clamp(ws.length / (planned * N/7), 0, 1);
  let weeksMet = 0; for (let k=0;k<N/7;k++){ const s=addDays(from,k*7), e=addDays(s,6); if (ws.filter(w=>w.date>=s&&w.date<=e).length >= planned) weeksMet++; }
  comp.completion = weeksMet / (N/7);
  const mid = addDays(from, N/2);
  const b1 = bestByExercise(ws.filter(w=>w.date<mid)), b2 = bestByExercise(ws.filter(w=>w.date>=mid));
  const shared = Object.keys(b1).filter(k => b2[k]);
  if (shared.length) comp.strength = shared.filter(k => b2[k] >= b1[k]).length / shared.length;
  const actDays = new Set(a.diary.filter(e=>inWin(e.date) && e.kind==='activity').map(e=>e.date));
  if (actDays.size) { let hit=0; for (let k=0;k<N;k++){ const d=addDays(from,k), t=dayTotals(a,d); if (t.steps>=CONFIG.stepTarget || t.activeMin>=30) hit++; } comp.activity = hit/N; }
  const wts = a.weights.filter(w=>w.date<=ref).sort((x,y)=>x.date.localeCompare(y.date));
  const goal = a.profile.goals[0], target = +a.profile.targetWeight;
  if (wts.length >= 2 && target && ['lose','gain','maintain'].includes(goal)) {
    const start = wts[0].kg, cur = wts[wts.length-1].kg;
    comp.goal = goal==='maintain' ? (Math.abs(cur-start) <= 1.5 ? 1 : 0.5) : clamp((goal==='lose' ? start-cur : cur-start) / Math.max(0.5, Math.abs(start-target)), 0, 1);
  } else if (comp.strength != null) comp.goal = comp.strength;
  let logDays = 0; for (let k=0;k<N;k++){ const d=addDays(from,k); if (a.diary.filter(e=>e.date===d && e.kind==='food').length >= 2) logDays++; }
  comp.logging = logDays / N;
  let sw=0, s=0; Object.keys(W).forEach(k => { if (comp[k] != null) { sw += W[k]; s += W[k]*comp[k]; } });
  return {score: Math.round(s/sw*100), comp, workouts: ws.length};
}
function achievements(a) {
  const out = [], ws = [...a.workouts].filter(w=>!w.dismissed).sort((x,y)=>x.date.localeCompare(y.date));
  if (ws[0]) out.push({t:'First completed workout', d:ws[0].date});
  const planned = Math.max(1, a.profile.days.length||3);
  for (const w of ws) { const end = addDays(w.date, 6); if (ws.filter(x=>x.date>=w.date && x.date<=end).length >= planned) { out.push({t:'First week of consistent training', d:end}); break; } }
  const prs = a.workouts.flatMap(w => (w.prs||[]).map(p => ({...p, d:w.date})));
  if (prs.length) out.push({t:`Personal record: ${exById(prs[prs.length-1].exId)?.name}`, d:prs[prs.length-1].d});
  const t = today(), c1 = ws.filter(w=>w.date>addDays(t,-14)).length, c0 = ws.filter(w=>w.date>addDays(t,-28) && w.date<=addDays(t,-14)).length;
  if (c0 && c1 > c0) out.push({t:'Improved workout consistency', d:t});
  const stepDay = [...new Set(a.diary.filter(e=>e.kind==='activity').map(e=>e.date))].sort().find(d => dayTotals(a,d).steps >= CONFIG.stepTarget);
  if (stepDay) out.push({t:`Activity goal reached (${n0(CONFIG.stepTarget)} steps)`, d:stepDay});
  const f = firstRecordDate(a); if (f && diffDays(f, t) >= 30) out.push({t:'First month of progress tracking', d:addDays(f,30)});
  return out.sort((x,y)=>y.d.localeCompare(x.d));
}

/* ---------- AI coach (rule-based; model integration point) ---------- */
const GOALS = {lose:'Lose weight', gain:'Gain weight', muscle:'Build muscle', strength:'Improve strength', endurance:'Improve endurance', maintain:'Maintain weight', general:'Improve general fitness'};
const TEMPLATES = {
  upper:{name:'Upper Body Power', muscles:'Chest, back, shoulders', patterns:['push-h','pull-v','push-v','pull-h']},
  lower:{name:'Lower Body Builder', muscles:'Quads, glutes, hamstrings', patterns:['squat','knee-ext','knee-flex','core']},
  full:{name:'Full Body Royal Circuit', muscles:'Full body', patterns:['squat','push-h','pull-h','core','cardio']},
  cardio:{name:'Engine Builder', muscles:'Heart & lungs, legs', patterns:['cardio','squat','core','cardio']},
};
function recommend(a, opts={}) {
  const p = a.profile, goal = p.goals[0] || 'general', exp = p.experience, where = opts.where || p.where;
  const recent = a.workouts.filter(w=>!w.dismissed && w.date > addDays(today(),-14));
  const planned = Math.max(1, p.days.length||3);
  const returning = a.workouts.length > 0 && recent.length < planned; // fewer sessions than one planned week in 14 days
  let order = ['strength','muscle'].includes(goal) ? ['upper','lower','full'] : goal==='endurance' ? ['cardio','full'] : ['full','cardio','upper','lower'];
  const last = {}; a.workouts.forEach(w => (w.template) && (!last[w.template] || w.date > last[w.template]) && (last[w.template]=w.date));
  order.sort((x,y)=>(last[x]||'0').localeCompare(last[y]||'0'));
  if (opts.shift) order = order.slice(opts.shift % order.length).concat(order.slice(0, opts.shift % order.length));
  const key = order[0], T = TEMPLATES[key];
  const scheme = goal==='strength' ? {sets:4, reps:'5–6', rest:120} : goal==='muscle'||goal==='gain' ? {sets:3, reps:'8–12', rest:90} : goal==='endurance' ? {sets:2, reps:'15–20', rest:45} : {sets:3, reps:'10–12', rest:60};
  if (exp==='beginner' || returning) scheme.sets = Math.max(2, scheme.sets-1);
  const pool = EXERCISES.filter(e => where==='home' ? e.home : where==='royal' ? (e.machine || ['plank','pushup'].includes(e.id)) : true);
  const used = new Set(), list = [];
  T.patterns.forEach(pt => { const e = pool.find(x => x.pattern===pt && !used.has(x.id)) || EXERCISES.find(x=>x.pattern===pt && x.home && !used.has(x.id)); if (e) { used.add(e.id); list.push(e); } });
  const best = bestByExercise(a.workouts);
  const items = list.map(e => {
    const last = lastSessionFor(a, e.id);
    let note = '';
    if (last && !e.cardio) { const top = Math.max(...last.sets.map(s=>+s.reps||0)); const hi = +scheme.reps.split('–')[1]; if (top >= hi) note = `You reached ${top} reps last time. Consider a small load increase if form stays solid.`; }
    return {ex:e, sets: e.cardio ? 1 : scheme.sets, reps: e.cardio ? (goal==='endurance'?'20 min':'12 min') : e.timed ? '30–45 s' : scheme.reps, rest: e.cardio?0:scheme.rest, last, note};
  });
  const mins = Math.round(8 + items.reduce((s,i)=> s + (i.ex.cardio ? parseInt(i.reps) : i.sets*(0.75 + i.rest/60)), 0));
  return {key, name:T.name + (returning?' (Restart)':''), muscles:T.muscles, goal:GOALS[goal], items, mins: Math.min(mins, (p.duration||60)+10), where,
    difficulty: exp==='advanced' ? 'Advanced' : exp==='intermediate' ? 'Intermediate' : 'Beginner', returning,
    equipment: [...new Set(items.map(i=>i.ex.equip))].join(', ')};
}
function lastSessionFor(a, exId) {
  const ws = [...a.workouts].filter(w=>!w.dismissed).sort((x,y)=>y.date.localeCompare(x.date) || (y.at||0)-(x.at||0));
  for (const w of ws) { const e = (w.exercises||[]).find(x=>x.exId===exId); if (e) return {...e, date:w.date}; }
  return null;
}
const alternativesFor = exId => { const e = exById(exId); return e ? EXERCISES.filter(x => x.pattern===e.pattern && x.id!==e.id) : []; };
function coachAnswer(a, q) {
  const s = q.toLowerCase(), p = a.profile;
  const recent = a.workouts.filter(w=>!w.dismissed && w.date > addDays(today(),-14));
  if (/injur|pain|hurt|doctor|medical/.test(s)) return 'I cannot assess pain or injuries. Please stop exercises that hurt and speak to a doctor or physiotherapist. A Royal Fitness trainer can help you adjust your plan once you are cleared.';
  if (/replace|instead|alternative|busy|taken|swap/.test(s)) {
    const eq = EXERCISES.find(e => s.includes(e.name.toLowerCase())) || EXERCISES.find(e => s.includes(e.name.toLowerCase().split(' ')[0]));
    if (!eq) return 'Tell me which machine or exercise you need to replace, for example "replace the leg press".';
    const alts = alternativesFor(eq.id);

  }

    const b1 = bestByExercise(ws.filter(w=>w.date<from)), b2 = bestByExercise(ws.filter(w=>w.date>=from));
    const lines = Object.keys(b2).filter(k=>b1[k]).map(k => `• ${exById(k)?.name}: ${b1[k].toFixed(0)} → ${b2[k].toFixed(0)} kg estimated 1-rep max (${b2[k]>=b1[k]?'+':''}${(b2[k]-b1[k]).toFixed(1)})`);

  }
  if (/consisten|motivat|skip|miss/.test(s)) {
    const planned = p.days.length || 3;
    return `In the last 14 days you logged ${recent.length} workout${recent.length===1?'':'s'} against a plan of ${planned*2}.\n` +
      (recent.length >= planned*2 ? 'You are on plan. Keep the same days and protect those time slots.' :
       `Try fixing ${planned} specific days (${p.days.join(', ')}) and shorter ${Math.max(25,(p.duration||45)-15)}-minute sessions on busy days. A short session still counts.`);
  }
  if (/schedule|plan my|week|days/.test(s)) {

    return `Your training days: ${p.days.join(', ')} · about ${p.duration} min each.\nSuggested rotation: ${Object.values(TEMPLATES).slice(0, p.days.length).map(t=>t.name).join(' → ')}.\nToday's pick: ${r.name}.`;
  }
  if (/home|no equipment|equipment|hotel|travel/.test(s)) {
    const r = recommend(a, {where:'home'});
    return `${r.name} (home version), about ${r.mins} min:\n` + r.items.map(i=>`• ${i.ex.name}: ${i.sets} × ${i.reps}`).join('\n');
  }
  if (/today|train|workout|what should/.test(s)) {
    const r = recommend(a);
    return `Today: ${r.name}, ${r.mins} min, ${r.difficulty.toLowerCase()}.\nFocus: ${r.muscles}.\n` + r.items.map(i=>`• ${i.ex.name}: ${i.sets} × ${i.reps}${i.rest?`, rest ${i.rest}s`:''}`).join('\n') + (r.returning ? '\nYou have trained less than planned recently, so I reduced the sets.' : '');
  }
  return 'I can help with: what to train today, a workout for your equipment, replacing a machine, your strength progress, consistency, and planning your week. Open conversation needs the AI model connection, which is not set up yet.';
}

/* ---------- meal plan ---------- */
function mealPlan(a, dayIdx) {
  const p = a.profile, b = bmr(p);
  const factor = {sedentary:1.2, light:1.375, moderate:1.55, active:1.725}[p.activity] || 1.375;
  const tdee = b ? Math.round(b*factor) : 2200;
  const goal = p.goals[0];
  const adj = goal==='lose' ? -400 : (goal==='gain'||goal==='muscle') ? 300 : 0;
  const floor = b ? Math.round(b) : 1500;                 // never plan below estimated resting needs
  const target = Math.max(floor, tdee + adj);
  const avoid = (p.diet||[]).flatMap(d => ({vegetarian:['meat','fish'], 'no-seafood':['fish'], 'no-nuts':['nuts'], 'no-dairy':['dairy'], 'no-meat':['meat']}[d]||[]));
  const ok = f => !f.tags.some(t => avoid.includes(t)) && !(p.restrict && f.name.toLowerCase().includes(p.restrict.toLowerCase()));
  const split = {breakfast:.25, lunch:.35, dinner:.3, snack:.1};
  const swaps = a.mealSwaps || {};
  const meals = Object.entries(split).map(([meal, share], i) => {
    const pool = FOODS.filter(f => (f.meal===meal || (meal==='lunch'&&f.royal)) && ok(f));
    const k = (dayIdx*3 + i + (swaps[dayIdx+':'+meal]||0)) % Math.max(1,pool.length);
    const f = pool[k] || FOODS[0];
    const qty = Math.round(clamp(target*share / f.kcal, .75, 1.5)*4)/4;
    return {meal, f, qty, kcal:Math.round(f.kcal*qty)};
  });
  return {tdee, target, meals, known: !!b};
}

function gauge(val, size=150, label='') {
  const r = 58, C = 2*Math.PI*r, pct = val==null ? 0 : val/100;
  return `<svg class="gauge" viewBox="0 0 150 150" width="${size}" height="${size}" role="img" aria-label="${label||'Score'} ${val??'not available'}">
    <circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--panel2)" stroke-width="12"/>
    <circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--yel)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*pct} ${C}" transform="rotate(-90 75 75)"/>
    <text x="75" y="${val==null?80:84}" text-anchor="middle" fill="var(--fg)" font-size="${val==null?22:44}" font-weight="800">${val==null?'—':val}</text>
    ${val!=null?`<text x="75" y="106" text-anchor="middle" fill="var(--mute)" font-size="12" font-family="Barlow,sans-serif">of 100</text>`:''}
  </svg>`;
}
function lineChart(pts, {h=180, unit='', color='var(--yel)', area=true, bars=false}={}) {
  if (!pts.length) return '';
  const W = 640, H = h, L = 44, R = 12, T = 14, B = 26;
  const vs = pts.map(p=>p.v), mn = bars ? 0 : Math.min(...vs), mx = Math.max(...vs);
  const lo = bars ? 0 : Math.floor(mn - (mx-mn)*.15 - (mx===mn?1:0)), hi = Math.ceil(mx + (mx-lo)*.1 + (mx===mn&&!bars?1:0)) || 1;
  const x = i => L + (pts.length===1 ? (W-L-R)/2 : i*(W-L-R)/(pts.length-1));
  const y = v => T + (H-T-B)*(1 - (v-lo)/(hi-lo||1));
  const ticks = [lo, lo+(hi-lo)/2, hi];
  const every = Math.ceil(pts.length/7);
  const bw = Math.max(4, (W-L-R)/pts.length*.6);
  const bx = i => L + (i+.5)*(W-L-R)/pts.length;
  let g = ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end" fill="var(--dim)" font-size="11" font-family="Barlow,sans-serif">${n0(t)}</text>`).join('');
  if (bars) {
    g += pts.map((p,i)=>`<rect x="${bx(i)-bw/2}" y="${y(p.v)}" width="${bw}" height="${Math.max(0,y(lo)-y(p.v))}" rx="2" fill="${color}"><title>${p.l}: ${n0(p.v)}${unit}</title></rect>`).join('');
    g += pts.map((p,i)=> i%every===0 ? `<text x="${bx(i)}" y="${H-6}" text-anchor="middle" fill="var(--dim)" font-size="11" font-family="Barlow,sans-serif">${p.l}</text>` : '').join('');
  } else {
    const d = pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
    if (area && pts.length>1) g += `<path d="${d}L${x(pts.length-1)},${y(lo)}L${x(0)},${y(lo)}Z" fill="${color}" opacity=".12"/>`;
    g += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>`;
    g += pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?color:'var(--ink)'}" stroke="${color}" stroke-width="2"><title>${p.l}: ${p.v}${unit}</title></circle>`).join('');
    g += pts.map((p,i)=> (i%every===0 || i===pts.length-1) ? `<text x="${x(i)}" y="${H-6}" text-anchor="middle" fill="var(--dim)" font-size="11" font-family="Barlow,sans-serif">${p.l}</text>` : '').join('');
  }
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">${g}</svg></div>`;
}
function qrSvg(text, cell=4) {
  try { const q = qrcode(0,'M'); q.addData(text); q.make(); return q.createSvgTag({cellSize:cell, margin:0, scalable:true}); }
  catch(e) { return `<div class="small" style="color:#000">QR unavailable</div>`; }
}

  else if (o.status==='paid') {

}

async function startCamera() {
  const v = $('#cam'); if (!v) return;
  if (!navigator.mediaDevices?.getUserMedia) { ui.scan = {...ui.scan, mode:null, error:{title:'Camera not available here.', body:'Use "Scan from photo" or search for the machine.'}}; return render(); }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    v.srcObject = camStream; await v.play();
    const track = camStream.getVideoTracks()[0], caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.torch && !ui.scan.torch) { ui.scan.torch = true; }
    const c = document.createElement('canvas'), ctx = c.getContext('2d', {willReadFrequently:true});
    const tick = () => {
      if (!camStream) return;
      if (v.readyState === v.HAVE_ENOUGH_DATA) {
        c.width = v.videoWidth; c.height = v.videoHeight; ctx.drawImage(v,0,0);
        const img = ctx.getImageData(0,0,c.width,c.height), code = window.jsQR && jsQR(img.data, img.width, img.height, {inversionAttempts:'dontInvert'});
        if (code && code.data) { handleQR(code.data); return; }
      }
      camRAF = requestAnimationFrame(tick);
    };
    tick();
  } catch (e) {
    stopCamera();
    ui.scan = {...ui.scan, mode:null, error: e.name==='NotAllowedError' ? {title:'Camera permission is needed.', body:'Allow camera access in your browser settings, or use "Scan from photo" or search instead.'} : {title:'The camera could not start.', body:'Use "Scan from photo" or search for the machine.'}};
    render();
  }
}
function handleQR(text) {

  const a = acc();
  if (!eq) { ui.scan = {mode:null, error:{title:'QR code not recognized.', body:'This code is not linked to a registered Royal Fitness machine yet. Search for the machine by name below, or ask staff to register it.'}}; return render(); }
  a.scans = [eq.id, ...a.scans.filter(x=>x!==eq.id)].slice(0,8); save();
  ui.scan = {}; go('equip-'+eq.id);
}

function finishSession() {
  const a = acc(), s = ui.session;

  const mins = Math.max(1, Math.round(elapsed(s)/60)), km = exercises.reduce((t,x)=>t+x.sets.reduce((u,y)=>u+(y.km||0),0),0);

  const w = {id:uid(), date:today(), at:s.startedAt, start:new Date(s.startedAt).toTimeString().slice(0,5), template:s.template, location:s.location, source:'app', type:s.type, exercises, prs, mins: Math.max(mins, cardioMins), km: Math.round(km*10)/10};

    </div></div>`;
}

/* ---------- diary ---------- */
function viewDiary(a) {
  const d = ui.diaryDate || today(), f = ui.diaryFilter, t = dayTotals(a, d);
  const entries = [
    ...a.diary.filter(e=>e.date===d).map(e=>({...e, sort:e.time})),
    ...t.wk.map(w=>({id:w.id, kind:'workout', time:w.start||'12:00', sort:w.start||'12:00', w})),
  ].filter(e => f==='all' || (f==='food'&&e.kind==='food') || (f==='workout'&&e.kind==='workout') || (f==='activity'&&['activity','water'].includes(e.kind))).sort((x,y)=>x.sort.localeCompare(y.sort));
  const C = {food:'var(--yel)', workout:'var(--ok)', activity:'var(--info)', water:'#60a5fa'};
  const week = Array.from({length:7},(_,i)=>addDays(d,i-6)).map(x=>({l:dow(x), v:dayTotals(a,x).consumed}));
  return `<div class="stack" style="gap:16px">
    <div class="page-h"><div><span class="eyebrow">Food & activity diary</span><h1>${d===today()?'Today':fmt(d)}</h1></div>
      <div class="row"><button class="iconbtn" data-act="diary-day" data-v="-1" aria-label="Previous day">${ic('back')}</button><button class="btn sm dark" data-act="diary-day" data-v="0">Today</button><button class="iconbtn" data-act="diary-day" data-v="1" aria-label="Next day" ${d>=today()?'disabled':''}>${ic('arrow')}</button></div></div>
    ${energyCard(t)}
    <div class="grid g4">
      <div class="tile"><span class="k">Protein</span><span class="v num">${t.p}<small>g</small></span></div><div class="tile"><span class="k">Carbs</span><span class="v num">${t.c}<small>g</small></span></div>
      <div class="tile"><span class="k">Fat</span><span class="v num">${t.f}<small>g</small></span></div><div class="tile"><span class="k">${ic('drop')} Water</span><span class="v num">${(t.water/1000).toFixed(1)}<small>L</small></span></div>
      <div class="tile"><span class="k">${ic('steps')} Steps</span><span class="v num">${n0(t.steps)}</span></div><div class="tile"><span class="k">Distance</span><span class="v num">${t.km.toFixed(1)}<small>km</small></span></div>
      <div class="tile"><span class="k">Active minutes</span><span class="v num">${t.activeMin}</span></div><div class="tile"><span class="k">${ic('dumb')} Workouts</span><span class="v num">${t.wk.length}</span></div>
    </div>
    <div class="row between"><div class="tabs">${[['all','All'],['food','Food'],['workout','Workouts'],['activity','Activity']].map(([k,l])=>`<button class="chip ${f===k?'on':''}" data-act="diary-filter" data-v="${k}">${l}</button>`).join('')}</div>
      <div class="row" style="gap:8px"><button class="btn sm" data-act="add-entry" data-v="food">${ic('plus')} Food</button><button class="btn sm dark" data-act="add-entry" data-v="photo">${ic('cam')} Photo</button><button class="btn sm dark" data-act="add-entry" data-v="activity">${ic('steps')} Activity</button><button class="btn sm dark" data-act="add-entry" data-v="workout">${ic('dumb')} Workout</button><button class="btn sm dark" data-act="add-water">${ic('drop')} +250 ml</button></div></div>
    ${entries.length ? `<div class="tl">${entries.map(e=>{
      if (e.kind==='workout') { const w=e.w; return `<div class="ev" style="--c:${C.workout}"><time class="num">${e.time}</time><div class="t"><b>${w.title || (w.exercises||[]).map(x=>exById(x.exId)?.name).slice(0,3).join(', ') || 'Workout'}</b><div class="macros"><span><b>${w.mins}</b> min</span><span>~<b>${w.kcal||0}</b> kcal est.</span><span>${esc(w.location||'')}</span><span>${w.source==='app'?'Logged in app':'Manual'}</span></div>${w.flag?`<div class="row" style="margin-top:6px"><span class="pill warn">Possible duplicate</span><button class="link small" data-act="keep-wk" data-id="${w.id}">Keep both</button><button class="link small" data-act="dismiss-wk" data-id="${w.id}">Don't count this one</button></div>`:''}</div><button class="iconbtn" data-act="del-wk" data-id="${w.id}" aria-label="Delete workout">${ic('trash')}</button></div>`; }
      if (e.kind==='food') return `<div class="ev" style="--c:${C.food}"><time class="num">${e.time}</time><div class="t"><b>${esc(e.title)}</b><div class="macros num"><span><b>${Math.round(e.kcal*e.qty)}</b> kcal</span><span>P <b>${Math.round(e.p*e.qty)}</b>g</span><span>C <b>${Math.round(e.c*e.qty)}</b>g</span><span>F <b>${Math.round(e.f*e.qty)}</b>g</span>${e.qty!==1?`<span>${e.qty} × serving</span>`:''}${e.source==='photo'?'<span>from photo</span>':''}</div></div><button class="iconbtn" data-act="edit-entry" data-id="${e.id}" aria-label="Edit">${ic('edit')}</button></div>`;
      if (e.kind==='water') return `<div class="ev" style="--c:${C.water}"><time class="num">${e.time}</time><div class="t"><b>Water</b><div class="macros"><span><b>${e.ml}</b> ml</span></div></div><button class="iconbtn" data-act="del-entry" data-id="${e.id}" aria-label="Delete">${ic('trash')}</button></div>`;
      return `<div class="ev" style="--c:${C.activity}"><time class="num">${e.time}</time><div class="t"><b>${esc(e.title)}</b><div class="macros num">${e.steps?`<span><b>${n0(e.steps)}</b> steps</span>`:''}${e.km?`<span><b>${e.km}</b> km</span>`:''}${e.mins?`<span><b>${e.mins}</b> active min</span>`:''}<span>${e.source==='manual'?'Manual entry':esc(e.source)}</span></div></div><button class="iconbtn" data-act="edit-entry" data-id="${e.id}" aria-label="Edit">${ic('edit')}</button></div>`;
    }).join('')}</div>` : empty('clock','Nothing logged for this day','Add a meal, a workout, steps or water to build your day.', `<button class="btn" data-act="add-entry" data-v="food">Add first entry</button>`)}
    <div class="card stack"><h3>Calories eaten · last 7 days</h3>${lineChart(week,{bars:true,unit:' kcal'})}</div>
  </div>`;
}
function energyCard(t) {
  const target = t.total || 0, pct = target ? clamp(t.consumed/target,0,1.5) : 0;
  const label = t.balance==null ? null : Math.abs(t.balance) < 150 ? 'About maintenance' : t.balance < 0 ? 'Estimated deficit' : 'Estimated surplus';
  return `<div class="card stack"><div class="row between"><h3>Estimated energy balance</h3><span class="tiny dim">All values are estimates</span></div>
    <div class="row" style="gap:20px;align-items:center">
      <svg viewBox="0 0 200 110" width="200" height="110" role="img" aria-label="Calories eaten compared with estimated expenditure"><path d="M15 100 A85 85 0 0 1 185 100" fill="none" stroke="var(--panel2)" stroke-width="14" stroke-linecap="round"/><path d="M15 100 A85 85 0 0 1 185 100" fill="none" stroke="${pct>1.05?'var(--warn)':'var(--yel)'}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${267*clamp(pct,0,1)} 400"/>
        <text x="100" y="84" text-anchor="middle" fill="var(--fg)" font-size="30" font-weight="800" font-family="Barlow Condensed,sans-serif">${t.balance==null?'—':(t.balance>0?'+':'')+n0(t.balance)}</text><text x="100" y="102" text-anchor="middle" fill="var(--mute)" font-size="11" font-family="Barlow,sans-serif">${label||'not enough data'}</text></svg>
      <dl class="kv minw0" style="flex:1;min-width:220px"><dt>Calories eaten</dt><dd class="num">${n0(t.consumed)}</dd><dt>Baseline needs (est.)</dt><dd class="num">${t.baseline==null?'add profile details':n0(t.baseline)}</dd><dt>Workouts (est.)</dt><dd class="num">${n0(t.exKcal)}</dd><dt>Steps (est.)</dt><dd class="num">${n0(t.stepKcal)}</dd><dt>Total expenditure (est.)</dt><dd class="num">${t.total==null?'—':n0(t.total)}</dd></dl></div>
    <p class="tiny dim">Balance = calories eaten − estimated total expenditure. Baseline uses your resting needs × 1.2 for daily living; workouts and steps are added on top. ${!t.food.length?'No food logged yet, so no balance is shown. ':''}One day's number does not predict weight change.</p></div>`;
}

/* ---------- progress ---------- */
function viewProgress(a) {
  const R = ui.progRange, t = today(), from = addDays(t, -R+1), inR = d => d>=from && d<=t;
  const ws = a.workouts.filter(w=>inR(w.date) && !w.dismissed);
  const days = Array.from({length:R},(_,i)=>addDays(from,i));
  const tots = days.map(d=>dayTotals(a,d));
  const steps = tots.reduce((s,x)=>s+x.steps,0), km = tots.reduce((s,x)=>s+x.km,0), act = tots.reduce((s,x)=>s+x.activeMin,0);
  const logDays = tots.filter(x=>x.food.length).length, bal = tots.filter(x=>x.balance!=null);
  const wts = a.weights.filter(w=>inR(w.date)).sort((x,y)=>x.date.localeCompare(y.date)), allW = [...a.weights].sort((x,y)=>x.date.localeCompare(y.date));
  const cur = allW.length ? allW[allW.length-1].kg : a.profile.weight;
  const sc = computeScore(a), prevW = computeScore(a, addDays(t,-7)), prevM = computeScore(a, addDays(t,-30));
  const wkPts = []; const step = R<=30 ? 7 : R<=180 ? 7 : 30;
  for (let s = 0; s < R; s += step) { const a0 = addDays(from, s), b0 = addDays(from, Math.min(R-1, s+step-1)); wkPts.push({l:fmtShort(a0), v:ws.filter(w=>w.date>=a0&&w.date<=b0).length}); }
  const stepPts = R<=30 ? days.map((d,i)=>({l:R<=7?dow(d):fmtShort(d), v:tots[i].steps})) : wkPts.map((p,i)=>{ const a0=addDays(from,i*step), b0=addDays(from,Math.min(R-1,i*step+step-1)); const ds=days.filter(d=>d>=a0&&d<=b0); return {l:p.l, v:Math.round(ds.reduce((s,d)=>s+tots[days.indexOf(d)].steps,0)/ds.length)}; });
  const hasData = ws.length || logDays || wts.length || steps;
  const C = sc?.comp || {};
  const compRow = (k,t2) => `<div class="stack" style="gap:4px"><div class="row between small"><span>${t2}</span><span class="num mute">${C[k]==null?'not enough data':Math.round(C[k]*100)+'%'} · weight ${CONFIG.score.weights[k]}</span></div><div class="bar"><i style="width:${(C[k]||0)*100}%"></i></div></div>`;
  return `<div class="stack" style="gap:16px">
    <div class="page-h"><h1>Your progress</h1></div>
    <div class="tabs">${[[7,'7 Days'],[30,'30 Days'],[90,'3 Months'],[180,'6 Months'],[365,'12 Months']].map(([v,l])=>`<button class="chip ${R===v?'on':''}" data-act="prog-range" data-v="${v}">${l}</button>`).join('')}</div>
    <div class="card grid" style="grid-template-columns:auto 1fr;gap:20px;align-items:center">
      ${gauge(sc?.score ?? null, 150, 'Royal Progress Score')}
      <div class="stack minw0"><h3>Royal Progress Score</h3>
        ${sc ? `<div class="row small"><span class="pill ${prevW&&sc.score>=prevW.score?'ok':'warn'}">Week ${prevW?(sc.score-prevW.score>=0?'+':'')+(sc.score-prevW.score):'—'}</span><span class="pill">Month ${prevM?(sc.score-prevM.score>=0?'+':'')+(sc.score-prevM.score):'—'}</span><span class="mute">Previous: ${prevW?prevW.score:'—'}</span></div>
          ${compRow('consistency','Workout consistency')}${compRow('completion','Weeks you hit your planned sessions')}${compRow('strength','Strength progression')}${compRow('activity','Daily activity')}${compRow('goal','Goal progress')}${compRow('logging','Food logging consistency')}
          <p class="tiny dim">Last 28 days, compared only with your own history. Logging rewards recording meals, never eating less. ${(() => { const low = Object.entries(C).filter(([,v])=>v!=null).sort((x,y)=>x[1]-y[1])[0]; return low ? 'Biggest opportunity: '+({consistency:'more sessions per week',completion:'hitting your planned days each week',strength:'gradual load increases',activity:'daily steps',goal:'steady progress toward your goal',logging:'logging at least two meals a day'})[low[0]]+'.' : ''; })()}</p>`
          : `<p class="mute small">Your score develops as you record activity. It appears after ${CONFIG.score.minDaysOfData} days of workouts, meals or steps.</p>`}
      </div></div>
    ${!hasData ? empty('chart','No progress data in this period','Complete a workout or add a diary entry and your charts will start here.', '<div class="row"><a class="btn" href="#workouts">Start a workout</a><a class="btn ghost" href="#diary">Open diary</a></div>') : `
    <div class="grid g4">
      <div class="tile"><span class="k">${ic('dumb')} Workouts completed</span><span class="v num">${ws.length}</span></div>
      <div class="tile"><span class="k">${ic('clock')} Workout time</span><span class="v num">${Math.floor(ws.reduce((s,w)=>s+(w.mins||0),0)/60)}h ${ws.reduce((s,w)=>s+(w.mins||0),0)%60}m</span></div>
      <div class="tile"><span class="k">${ic('fire')} Calories burned (est.)</span><span class="v num">${n0(ws.reduce((s,w)=>s+(w.kcal||0),0))}<small>kcal</small></span></div>
      <div class="tile"><span class="k">${ic('trophy')} Total weight lifted</span><span class="v num">${n0(ws.reduce((s,w)=>s+volume(w),0))}<small>kg</small></span></div>
      <div class="tile"><span class="k">${ic('steps')} Total steps</span><span class="v num">${n0(steps)}</span></div>
      <div class="tile"><span class="k">Distance</span><span class="v num">${km.toFixed(1)}<small>km</small></span></div>
      <div class="tile"><span class="k">Active minutes</span><span class="v num">${n0(act)}</span></div>
      <div class="tile"><span class="k">${ic('food')} Days with food logged</span><span class="v num">${logDays}<small>/ ${R}</small></span></div>
    </div>
    <div class="grid g2">
      <div class="card stack"><div class="row between"><h3>Body weight</h3><span class="small mute num">Now ${cur||'—'} kg · target ${a.profile.targetWeight||'—'} kg${allW.length>1?` · change ${(cur-allW[0].kg>0?'+':'')}${(cur-allW[0].kg).toFixed(1)} kg`:''}</span></div>${wts.length>1?lineChart(wts.map(w=>({l:fmtShort(w.date), v:w.kg})),{unit:' kg'}):'<p class="mute small">Log your weight at least twice in this period to see a trend.</p>'}<button class="btn sm dark" data-act="log-weight" style="align-self:flex-start">${ic('plus')} Log weight</button></div>
      <div class="card stack"><h3>Training consistency</h3>${lineChart(wkPts,{bars:true,unit:' workouts'})}<span class="tiny dim">Workouts per ${step===30?'30 days':'week'}</span></div>
      <div class="card stack"><h3>Steps</h3>${lineChart(stepPts,{unit:' steps', color:'var(--gold2)'})}<span class="tiny dim">${R<=30?'Per day':'Daily average per period'}</span></div>
      <div class="card stack"><h3>Energy balance (est.)</h3>${bal.length?`<p class="num" style="font:700 2rem var(--display)">${(()=>{const v=Math.round(bal.reduce((s,x)=>s+x.balance,0)/bal.length);return (v>0?'+':'')+n0(v)})()} <small class="mute" style="font:500 .9rem var(--body)">kcal / day average</small></p><p class="tiny dim">Average of ${bal.length} days with food logged. Estimates only.</p>`:'<p class="mute small">Log food to see your estimated balance.</p>'}</div>
    </div>
    <div class="card stack"><h3>Achievements</h3>${achievements(a).length?`<div class="list">${achievements(a).map(x=>`<div class="li"><span class="y">${ic('trophy')}</span><div class="t"><b>${x.t}</b><span class="small mute">${fmt(x.d)}</span></div></div>`).join('')}</div>`:'<p class="mute small">Your first achievement comes with your first completed workout.</p>'}</div>`}
  </div>`;
}

function renderAccountInline(a, T, tab) {

function accountBody(a) {
  const st = memberStatus(a), cur = currentMembership(a), end = st.end, total = cur ? diffDays(cur.start, cur.end)+1 : 1;

}
function viewAccount(a) { return `<div class="stack" style="gap:16px"><div class="page-h"><h1>Membership</h1></div>${statusBanner(a)}${accountBody(a)}</div>`; }
function viewRenew(a) {

    ${o && ['pending','awaiting'].includes(o.status) ? `<div class="card stack"><h3>${o.status==='awaiting'?'Waiting for payment confirmation':'Complete renewal payment'}</h3><dl class="kv"><dt>Order</dt><dd class="mono">${o.id}</dd><dt>Plan</dt><dd>${planById(o.planId).name}</dd><dt>Amount</dt><dd class="num">${money(o.amount)}</dd></dl>

    o && ['failed','cancelled'].includes(o.status) ? `<div class="notice" role="alert"><strong>Renewal payment ${o.status}.</strong> Your membership has not been changed. Choose a plan to try again.</div>` : ''}

function viewNotifications(a) {

}

      <input type="hidden" name="foodId" id="af-id"><div class="grid" style="grid-template-columns:2fr 1fr">
      <label class="f" for="af-title">Food<input class="in" id="af-title" name="title" required placeholder="Pick from the list or type your own"></label><label class="f" for="af-kcal">kcal per serving<input class="in" id="af-kcal" name="kcal" type="number" required></label></div>
      <div class="grid g3"><label class="f" for="af-p">Protein g<input class="in" id="af-p" name="p" type="number" value="0"></label><label class="f" for="af-c">Carbs g<input class="in" id="af-c" name="c" type="number" value="0"></label><label class="f" for="af-f">Fat g<input class="in" id="af-f" name="f" type="number" value="0"></label></div>
      <div class="grid" style="grid-template-columns:1fr 1fr"><label class="f" for="af-qty">Portion (× serving)<input class="in" id="af-qty" name="qty" type="number" step="0.25" min="0.25" value="1"></label><label class="f" for="af-time">Time<input class="in" id="af-time" name="time" type="time" value="${nowT}"></label></div>
      <p class="tiny dim">Values are estimates. Adjust them if you know better.</p><button class="btn">Add to diary</button></form>`);
  }
  if (kind==='photo') return modal(`<h2 style="font-size:1.8rem">Food photo</h2><div class="stack" id="photo-step">
      <label class="btn" for="food-img" style="cursor:pointer">${ic('cam')} Take or upload photo</label><input id="food-img" type="file" accept="image/*" capture="environment" hidden data-change="food-photo">
      <p class="small mute">Step 1 of 4: take the photo. Then you confirm what's on the plate, adjust the portion and save.</p></div>`);
  if (kind==='activity') return modal(`<h2 style="font-size:1.8rem">Add activity</h2><form class="stack" data-form="add-act">
      <label class="f" for="aa-title">Activity<input class="in" id="aa-title" name="title" value="Walk" required></label>
      <div class="grid g3"><label class="f" for="aa-s">Steps<input class="in" id="aa-s" name="steps" type="number" min="0" value="0"></label><label class="f" for="aa-km">Distance km<input class="in" id="aa-km" name="km" type="number" step="0.1" min="0" value="0"></label><label class="f" for="aa-m">Active minutes<input class="in" id="aa-m" name="mins" type="number" min="0" value="0"></label></div>
      <label class="f" for="aa-t">Time<input class="in" id="aa-t" name="time" type="time" value="${nowT}"></label><button class="btn">Add to diary</button></form>`);
  if (kind==='workout') return modal(`<h2 style="font-size:1.8rem">Add a workout</h2><p class="small mute">For sessions you didn't track live, such as a class or a game.</p><form class="stack" data-form="add-wk">
      <label class="f" for="aw-t">Name<input class="in" id="aw-t" name="title" placeholder="e.g. Spinning class" required></label>
      <div class="grid g3"><label class="f" for="aw-type">Type<select class="in" id="aw-type" name="type"><option value="cardio">Cardio</option><option value="strength">Strength</option><option value="hiit">HIIT</option><option value="other">Other</option></select></label><label class="f" for="aw-m">Minutes<input class="in" id="aw-m" name="mins" type="number" min="1" required></label><label class="f" for="aw-time">Start<input class="in" id="aw-time" name="time" type="time" value="${nowT}"></label></div>
      <label class="f" for="aw-src">Source<select class="in" id="aw-src" name="source"><option value="manual">Manual entry</option><option value="watch">From my watch (typed in)</option></select></label><button class="btn">Add workout</button></form>`);
}
function foodResults(q) {
  q = q.toLowerCase();
  return FOODS.filter(f => !q || f.name.toLowerCase().includes(q)).slice(0,12).map(f=>`<button type="button" class="li" style="background:none;border:0;border-top:1px solid var(--line);color:inherit;text-align:left;cursor:pointer;width:100%" data-act="pick-food" data-id="${f.id}" data-title="${esc(f.name.replace('Royal Nutrition: ',''))}" data-k="${f.kcal}" data-p="${f.p}" data-c="${f.c}" data-f="${f.f}"><div class="t"><b>${esc(f.name)}</b><span class="small mute num">${f.kcal} kcal · P ${f.p} · C ${f.c} · F ${f.f}</span></div></button>`).join('');
}
A['pick-food'] = el => { const set = (i,v) => { const x = $('#'+i); if (x) x.value = v; };
  set('af-id', el.dataset.id); set('af-title', el.dataset.title); set('af-kcal', el.dataset.k); set('af-p', el.dataset.p); set('af-c', el.dataset.c); set('af-f', el.dataset.f);
  const q = $('#pq-qty') || $('#af-qty'); if (q) q.focus(); };

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'BUTTON' || el.dataset.act === 'modal-bg') { if (el.dataset.act !== 'modal-bg') e.preventDefault(); }
  fn(el, e);
});
document.addEventListener('input', e => {
  const k = e.target.dataset.input;
  if (e.target.dataset.set) { const [x,s,f] = e.target.dataset.set.split(':'); ui.session.exercises[+x].sets[+s][f] = e.target.value; return; }
  if (!k) return;
  if (k==='foodQ') { $('#food-results').innerHTML = foodResults(e.target.value); return; }
  if (k==='pickQ') { $('#pick-list').innerHTML = pickList(e.target.value); return; }
  if (k==='photoQ') { $('#photo-results').innerHTML = foodResults(e.target.value).replaceAll('data-act="pick-food"','data-act="photo-pick"'); return; }
  if (k==='scanQ') { ui.scan.q = e.target.value; const pos = e.target.selectionStart; render(); const i = $('#eq-q'); if (i) { i.focus(); i.setSelectionRange(pos,pos); } return; }
  if (k==='libQ') { ui.libQ = e.target.value; const pos = e.target.selectionStart; render(); const i = $('#lib-q'); if (i) { i.focus(); i.setSelectionRange(pos,pos); } return; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.pref) { const a = acc(); a.prefs[t.dataset.pref] = t.checked; save(); toast('Preference saved'); return; }
  if (t.type === 'checkbox' && t.closest('label.chip')) t.closest('label.chip').classList.toggle('on', t.checked);
  const k = t.dataset.change; if (!k) return;
  const file = t.files && t.files[0]; if (!file) return;
  if (k === 'qr-file') {
    const img = new Image(); img.onload = () => { const c = document.createElement('canvas'); const s = Math.min(1, 1200/Math.max(img.width,img.height)); c.width = img.width*s; c.height = img.height*s; const ctx = c.getContext('2d'); ctx.drawImage(img,0,0,c.width,c.height);
      const d = ctx.getImageData(0,0,c.width,c.height), code = window.jsQR && jsQR(d.data, d.width, d.height);
      URL.revokeObjectURL(img.src);
      if (code) handleQR(code.data); else { ui.scan = {error:{title:'No QR code found in that photo.', body:'Try again closer to the code with good light, or search for the machine.'}}; render(); } };
    img.src = URL.createObjectURL(file);
  }
  if (k === 'form-video') { if (ui.form.url) URL.revokeObjectURL(ui.form.url); ui.form.url = URL.createObjectURL(file); ui.form.name = file.name; render(); }
  if (k === 'food-photo') {
    const url = URL.createObjectURL(file);
    $('#photo-step').innerHTML = `<img src="${url}" alt="Your food photo" style="border-radius:10px;max-height:240px;object-fit:cover;width:100%">
      <div class="notice small"><strong>Automatic food recognition is not connected yet.</strong> Pick what's on your plate below. A photo alone can't show oils, sauces or exact weight, so check the portion.</div>
      <label class="f" for="pq">Step 2: what's on the plate?<input class="in" id="pq" data-input="photoQ" placeholder="Search, e.g. cassava leaves" autocomplete="off"></label>
      <div class="list" id="photo-results" style="max-height:200px;overflow-y:auto">${foodResults('').replaceAll('data-act="pick-food"','data-act="photo-pick"')}</div>
      <form class="stack" data-form="photo-food"><input type="hidden" id="pp-id" name="foodId"><label class="f" for="pp-title">Selected food<input class="in" id="pp-title" name="title" required readonly placeholder="Select from the list"></label>
        <label class="f" for="pq-qty">Step 3: portion (× serving)<input class="in" id="pq-qty" name="qty" type="number" step="0.25" min="0.25" value="1"></label>
        <p class="small mute" id="pp-est">Step 4: estimated nutrition appears here.</p><button class="btn">Save to food diary</button></form>`;
  }
});
A['photo-pick'] = el => { const f = FOODS.find(x=>x.id===el.dataset.id); $('#pp-id').value = f.id; $('#pp-title').value = f.name.replace('Royal Nutrition: ','');
  const q = +$('#pq-qty').value||1; $('#pp-est').innerHTML = `Estimated: <b class="num">${Math.round(f.kcal*q)} kcal</b> · P ${Math.round(f.p*q)}g · C ${Math.round(f.c*q)}g · F ${Math.round(f.f*q)}g`; };

const FORMS = {
  'checkout-details'(fd){
    const name = fd.get('name').trim(), phone = fd.get('phone').trim(), email = fd.get('email').trim();
    if (name.length < 2) return 'Enter your full name.';
    if (phone.replace(/\D/g,'').length < 8) return 'Enter a valid mobile number, for example +232 76 123 456.';
    if (email && !/^\S+@\S+\.\S+$/.test(email)) return 'Check the email address or leave it empty.';
    Object.assign(ui.checkout, {name, phone, email});
    const o = Backend.createOrder({planId:ui.checkout.planId, name, phone, email});
    ui.checkout.orderId = o.id; ui.checkout.step = 3; render();
  },
  token(fd){ ui.act = {token: fd.get('token').trim().toUpperCase()}; render(); },
  resend(fd){ const r = Backend.resendToken(fd.get('order'), fd.get('phone')); if (r.error) return r.error; ui.act = {token:r.t.token}; render(); toast('New code issued (shown in demo; sent by SMS in production)'); },
  'create-account'(fd){
    const pw = fd.get('pw'); if (pw.length < 8) return 'Use at least 8 characters for your password.'; if (pw !== fd.get('pw2')) return 'Passwords do not match.';
    const r = Backend.redeem(ui.act.token, {name:fd.get('name').trim()||'Member', password:pw});
    if (r.error === 'exists') { ui.act = {state:'exists'}; return render(); }
    if (r.error) { ui.act = {token:ui.act.token}; return render(); }
    ui.act = {}; ui.checkout = {step:1}; ui.otp = null; go('dash');
  },
  otp(fd){ if (fd.get('otp').trim() !== ui.otp) return 'That code is not right. Check the SMS and try again.'; acc().verified = true; save(); render(); },
  login(fd){ const r = Backend.login(fd.get('phone'), fd.get('pw')); if (r.error) return r.error; go(ui.pendingRoute && !PUBLIC.includes(ui.pendingRoute) ? ui.pendingRoute : 'dash'); },
  onboard(fd){
    const a = acc(), p = a.profile, age = +fd.get('age'), h = +fd.get('height'), w = +fd.get('weight');
    if (!(age>=14 && age<=100)) return 'Enter an age between 14 and 100.'; if (!(h>=120 && h<=230)) return 'Enter your height in centimetres.'; if (!(w>=30 && w<=300)) return 'Enter your weight in kilograms.';
    const goals = fd.getAll('goals'), days = fd.getAll('days'); if (!goals.length) return 'Choose at least one goal.'; if (!days.length) return 'Choose at least one training day.';
    Object.assign(p, {age, height:h, weight:w, sex:fd.get('sex'), experience:fd.get('experience'), activity:fd.get('activity'), goals, days, duration:+fd.get('duration'), where:fd.get('where'), targetWeight:+fd.get('targetWeight')||'', timeframe:fd.get('timeframe'), diet:fd.getAll('diet'), restrict:fd.get('restrict').trim()});
    a.weights.push({date:today(), kg:w}); a.onboarded = true; save(); go('dash');
  },
  ask(fd, form){ askCoach(fd.get('q')); },
  profile(fd){
    const a = acc(), p = a.profile;
    if (fd.has('goals')) { const g = fd.getAll('goals'); if (!g.length) return toast('Choose at least one goal'); Object.assign(p, {goals:g, targetWeight:+fd.get('targetWeight')||'', timeframe:fd.get('timeframe'), duration:+fd.get('duration'), where:fd.get('where')}); }
    if (fd.has('name')) { a.name = fd.get('name').trim()||a.name; const w = +fd.get('weight'); if (w && w !== p.weight) a.weights.push({date:today(), kg:w}); Object.assign(p, {age:+fd.get('age')||p.age, sex:fd.get('sex'), height:+fd.get('height')||p.height, weight:w||p.weight, activity:fd.get('activity'), experience:fd.get('experience')}); }
    save(); render(); toast('Saved');
  },
  weight(fd){ const a = acc(), kg = +fd.get('kg'); a.weights = a.weights.filter(w=>w.date!==today()); a.weights.push({date:today(), kg}); a.profile.weight = kg; save(); modal(''); render(); toast('Weight logged'); },
  'add-food'(fd){ const a = acc(); const k = +fd.get('kcal'); if (!fd.get('title').trim() || !(k>0)) return toast('Choose a food or enter a name and calories');
    a.diary.push({id:uid(), date:ui.diaryDate||today(), time:fd.get('time'), kind:'food', title:fd.get('title').trim(), foodId:fd.get('foodId')||null, qty:+fd.get('qty')||1, kcal:k, p:+fd.get('p')||0, c:+fd.get('c')||0, f:+fd.get('f')||0, source:'manual'}); save(); modal(''); render(); toast('Added to your diary'); },
  'photo-food'(fd){ const a = acc(), f = FOODS.find(x=>x.id===fd.get('foodId')); if (!f) return toast('Select a food from the list');
    a.diary.push({id:uid(), date:ui.diaryDate||today(), time:new Date().toTimeString().slice(0,5), kind:'food', title:f.name.replace('Royal Nutrition: ',''), foodId:f.id, qty:+fd.get('qty')||1, kcal:f.kcal, p:f.p, c:f.c, f:f.f, source:'photo'}); save(); modal(''); render(); toast('Saved to your food diary'); },
  'add-act'(fd){ const a = acc(); a.diary.push({id:uid(), date:ui.diaryDate||today(), time:fd.get('time'), kind:'activity', title:fd.get('title').trim()||'Activity', steps:+fd.get('steps')||0, km:+fd.get('km')||0, mins:+fd.get('mins')||0, source:'manual'}); save(); modal(''); render(); },
  'add-wk'(fd){ const a = acc(), d = ui.diaryDate||today(), time = fd.get('time'); const [hh,mm] = time.split(':').map(Number);
    const w = {id:uid(), date:d, at:parseISO(d).getTime()+(hh*60+mm)*60e3, start:time, title:fd.get('title').trim(), type:fd.get('type'), mins:+fd.get('mins'), location:'', source:fd.get('source'), exercises:[]};
    w.kcal = workoutKcal(w, a.profile.weight); flagDuplicates(a, w); a.workouts.push(w); save(); modal(''); render(); if (w.flag) toast('This may duplicate another workout. Review it in the diary.'); },
  'edit-food'(fd, form){ const e = acc().diary.find(x=>x.id===form.dataset.id); e.time = fd.get('time'); e.qty = +fd.get('qty')||1; save(); modal(''); render(); },
  'edit-act'(fd, form){ const e = acc().diary.find(x=>x.id===form.dataset.id); e.time = fd.get('time'); e.steps = +fd.get('steps')||0; e.mins = +fd.get('mins')||0; e.km = e.km || Math.round(e.steps*0.00075*10)/10; save(); modal(''); render(); },
};
document.addEventListener('submit', e => {
  const form = e.target, k = form.dataset.form; if (!k || !FORMS[k]) return;
  e.preventDefault();
  const err = FORMS[k](new FormData(form), form);
  const box = form.querySelector('.err'); if (box) box.textContent = typeof err === 'string' ? err : '';
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal-root').innerHTML) modal(''); });

/* Android app: hardware back button walks back through screens instead of closing the app */
try { const CapApp = window.Capacitor?.Plugins?.App; if (CapApp) CapApp.addListener('backButton', () => { if ($('#modal-root').innerHTML) modal(''); else if (!['home','dash'].includes(route())) history.back(); else CapApp.exitApp(); }); } catch(e) {}

render();
</script>
